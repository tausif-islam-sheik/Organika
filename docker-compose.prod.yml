services:
  proxy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-ghcr.io/organika}/backend:${TAG:-latest}
    env_file: [.env]
    restart: unless-stopped

  frontend:
    image: ${REGISTRY:-ghcr.io/organika}/frontend:${TAG:-latest}
    restart: unless-stopped

volumes: { caddy_data: {} }

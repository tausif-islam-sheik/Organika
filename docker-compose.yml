services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop123}
      POSTGRES_DB: shop
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: { context: ., dockerfile: backend/Dockerfile, target: dev }
    env_file: [.env]
    ports: ["4000:4000"]
    volumes:
      - ./backend/src:/repo/backend/src
      - ./packages:/repo/packages
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile, target: dev }
    command: pnpm --filter backend worker:dev
    env_file: [.env]
    depends_on: [backend]

  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile, target: dev }
    environment:
      API_INTERNAL_URL: http://backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports: ["3000:3000"]
    volumes:
      - ./frontend/app:/repo/frontend/app
      - ./frontend/components:/repo/frontend/components
      - ./packages:/repo/packages

volumes: { pg_data: {}, redis_data: {} }
